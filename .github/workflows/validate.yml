name: Validate repository

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Validate live-build tree
        run: bash ./scripts/validate-tree.sh

  packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Debian 13 package manifest
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            debian:13 \
            bash -euxo pipefail -c '
              sed -i "s/Components: main/Components: main contrib non-free-firmware/" /etc/apt/sources.list.d/debian.sources
              apt-get update
              bash ./scripts/validate-packages.sh
            '
  live-build-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Debian live-build configuration
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -w /work \
            debian:13 \
            bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build
              bash ./scripts/validate-live-build-config.sh
            '
