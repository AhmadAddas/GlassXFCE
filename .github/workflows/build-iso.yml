name: Build ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual test build"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MAX_ISO_MIB: 1850
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Choose version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: bash ./scripts/validate-release-version.sh "$GITHUB_REF_NAME" "${{ steps.version.outputs.value }}"

      - name: Verify checked-out build tree
        shell: bash
        run: |
          set -euo pipefail
          required=(
            build.sh
            auto/config
            scripts/build-host-preflight.sh
            scripts/release-check.sh
            scripts/report-iso-payload.sh
            scripts/smoke-test-iso.sh
            scripts/verify-boot-menu.sh
            scripts/verify-build-metadata.sh
            scripts/verify-glass-assets.sh
            scripts/verify-image-identity.sh
            scripts/verify-installer-payload.sh
            scripts/verify-runtime-packages.sh
            scripts/verify-secure-boot.sh
            scripts/verify-squashfs-format.sh
          )

          missing=0
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Required build file is missing from the checked-out revision"
              missing=1
            fi
          done

          if (( missing )); then
            echo "::error::The selected branch/tag is not a complete GlassXFCE build snapshot. Upload/extract the cumulative commit ZIP as a whole, including scripts/."
            exit 1
          fi

          # GitHub web uploads and ZIP extraction can lose executable bits.
          # Normalize them here before live-build sees the source tree.
          chmod +x build.sh scripts/*.sh auto/config auto/clean
          find config/hooks -type f \( -name '*.hook.chroot' -o -name '*.hook.binary' \) -exec chmod +x {} +
          find config/includes.chroot/usr/local/bin -maxdepth 1 -type f -exec chmod +x {} +
          chmod +x config/includes.chroot/etc/skel/Desktop/install-glassxfce.desktop

      - name: Check build network sources
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local label="$1" url="$2"
            echo "network-preflight: checking $label"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 45 \
              --output /dev/null \
              "$url"
          }

          probe "Debian Trixie archive" \
            "https://deb.debian.org/debian/dists/trixie/InRelease"
          probe "WhiteSur source host" \
            "https://github.com/vinceliuice/WhiteSur-gtk-theme.git/info/refs?service=git-upload-pack"

          echo "network-preflight: required build sources are reachable"

      - name: Build Debian 13 ISO in Debian container
        id: iso_build
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --privileged \
            -e VERSION="${{ steps.version.outputs.value }}" \
            -e GIT_COMMIT="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:13 \
            bash -euxo pipefail -c '
              apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
              DEBIAN_FRONTEND=noninteractive apt-get \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates git rsync \
                xz-utils sassc libglib2.0-dev-bin libxml2-utils
              bash ./scripts/build-host-preflight.sh
              bash ./build.sh
            ' 2>&1 | tee build.log

      - name: Upload failed build log
        if: failure() && steps.iso_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: glassxfce-build-log-${{ steps.version.outputs.value }}
          path: build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Install ISO smoke-test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso squashfs-tools sbsigntool

      - name: Validate release artifacts
        shell: bash
        run: bash ./scripts/release-check.sh dist "${{ steps.version.outputs.value }}"

      - name: Verify build metadata
        shell: bash
        run: bash ./scripts/verify-build-metadata.sh dist "${{ steps.version.outputs.value }}" "$GITHUB_SHA"

      - name: Report ISO size
        shell: bash
        run: |
          iso=$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)
          bytes=$(stat -c %s "$iso")
          mib=$(( (bytes + 1024 * 1024 - 1) / (1024 * 1024) ))
          {
            echo "### GlassXFCE ISO size"
            echo
            echo "- Image: \`$(basename "$iso")\`"
            echo "- Size: **${mib} MiB**"
            echo "- Release budget: **${MAX_ISO_MIB} MiB**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report compressed payload breakdown
        shell: bash
        run: bash ./scripts/report-iso-payload.sh dist/*.iso >> "$GITHUB_STEP_SUMMARY"

      - name: Verify SquashFS release compression
        shell: bash
        run: bash ./scripts/verify-squashfs-format.sh dist/*.iso

      - name: Verify protected Glass design assets
        shell: bash
        run: bash ./scripts/verify-glass-assets.sh dist/*.iso

      - name: Verify live hardware and desktop packages
        shell: bash
        run: bash ./scripts/verify-runtime-packages.sh dist/*.iso

      - name: Verify live and installer payloads
        shell: bash
        run: bash ./scripts/verify-installer-payload.sh dist/*.iso

      - name: Verify live and install boot menu choices
        shell: bash
        run: bash ./scripts/verify-boot-menu.sh dist/*.iso

      - name: Verify image identity
        shell: bash
        run: bash ./scripts/verify-image-identity.sh dist/*.iso "${{ steps.version.outputs.value }}"

      - name: Verify signed UEFI bootloader
        shell: bash
        run: bash ./scripts/verify-secure-boot.sh dist/*.iso

      - name: Smoke-test ISO boot structure
        shell: bash
        run: bash ./scripts/smoke-test-iso.sh dist/*.iso

      # Manual builds are short-lived test artifacts only.
      - name: Upload manual test ISO
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: glassxfce-${{ steps.version.outputs.value }}-amd64
          path: |
            dist/*.iso
            dist/*.sha256
            dist/SHA256SUMS
            dist/build-info.txt
          retention-days: 3
          compression-level: 0

      # Tagged builds go to Releases instead of duplicating the ISO as an Actions artifact.
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.iso dist/*.sha256 dist/SHA256SUMS dist/build-info.txt \
            --title "GlassXFCE $GITHUB_REF_NAME" \
            --generate-notes
