backend = "xrender";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 18;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.24;

corner-radius = 12;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

rules = (
  { match = "class_g = 'Xfdesktop' && window_type != 'desktop'"; blur-background = false; opacity = 1.0; shadow = true; corner-radius = 10; },
  {
    match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'combo'";
    blur-background = false;
    opacity = 1.0;
    shadow = true;
    corner-radius = 10;
  },
  { match = "fullscreen"; corner-radius = 0; },
  { match = "window_type = 'desktop'"; shadow = false; corner-radius = 0; },
  { match = "window_type = 'dock' && class_g != 'Plank'"; shadow = true; },
  { match = "class_g = 'Plank'"; shadow = false; corner-radius = 0; }
);
