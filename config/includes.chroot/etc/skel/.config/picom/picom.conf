backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 22;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.28;

corner-radius = 14;

blur: {
  method = "dual_kawase";
  strength = 5;
};

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.16;
    scale = 0.96;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.14;
    scale = 0.96;
  }
);

rules = (
  {
    match = "fullscreen";
    corner-radius = 0;
  },
  {
    match = "window_type = 'desktop'";
    shadow = false;
    corner-radius = 0;
  },
  {
    match = "window_type = 'dock'";
    shadow = true;
    blur-background = true;
  },
  {
    match = "class_g = 'Rofi'";
    blur-background = true;
    corner-radius = 18;
  }
);
