# GlassXFCE GRUB compatibility shim.
# Debian live-build generated menu fragments may source this path. Do not set
# GRUB's `theme` variable here: some firmware/GRUB combinations resolve theme
# directories differently and can emit "not a regular file" before the menu.
# The normal background_image path is enough for our lightweight boot menu.
insmod png
unset theme
if [ -f /boot/grub/splash.png ]; then
    background_image /boot/grub/splash.png
fi
