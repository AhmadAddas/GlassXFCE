# GlassXFCE graphical GRUB theme loader.
# GRUB's `theme` variable must point to the theme file itself, not its
# containing directory. A directory path triggers "not a regular file" on GRUB.
insmod png
if [ -f /boot/grub/themes/glassxfce/theme.txt ]; then
    set theme=/boot/grub/themes/glassxfce/theme.txt
    export theme
else
    # Never fall back to Debian's stock GRUB theme. Keep the GlassXFCE splash
    # even if a damaged image is missing the custom theme file.
    unset theme
    if [ -f /boot/grub/splash.png ]; then
        background_image /boot/grub/splash.png
    fi
fi
