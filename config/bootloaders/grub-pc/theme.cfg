# GlassXFCE GRUB compatibility theme.
# live-build generated installer/menu fragments may source /boot/grub/theme.cfg.
# Always point GRUB at a real theme file so it never resolves an empty theme to
# /boot/grub/themes/ and throws a boot-time "file not found" error.
insmod png
if [ -f /boot/grub/themes/glassxfce/theme.txt ]; then
    set theme=/boot/grub/themes/glassxfce/theme.txt
    export theme
elif [ -f /boot/grub/splash.png ]; then
    set theme=
    background_image /boot/grub/splash.png
fi
